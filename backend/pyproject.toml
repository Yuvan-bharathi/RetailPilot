[project]
name = "retailpilot-backend"
version = "0.1.0"
description = "RetailPilot AI - FMCG replenishment platform (API, agents, jobs)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery>=5.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "mlxtend>=0.23",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "factory-boy>=3.3",
    "pandas-stubs>=2.2",
    "celery-types>=0.22",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # allow unicode (₹, ×, −) in strings/comments/docstrings
    "N818",  # exception names follow the spec (PermissionDenied, NotFound), not the *Error suffix
    "E501",  # line length is enforced by `ruff format`; long comments/docstrings are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N814", "N817"]  # short aliases such as TE / RC in tests

[tool.ruff.lint.isort]
known-first-party = ["app", "data"]

# --- Mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "../data"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["mlxtend.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- Pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs PostgreSQL / Redis (docker compose)",
    "scenario: runs the nightly pipeline on synthetic data",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
